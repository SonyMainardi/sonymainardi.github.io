<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fb" />
    <title>Currículo — Sony Mainardi</title>
    <meta name="description" content="Currículo de Sony Mainardi, desenvolvedor full stack em Brasília: experiência, formação, skills e projetos." />
    <link rel="canonical" href="https://sonymainardi.github.io/cv.html" />

    <script>
      (function () {
        try {
          var lang = localStorage.getItem('portfolio:lang')
          if (lang !== 'pt' && lang !== 'en') {
            lang = (navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en'
          }
          document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en'
        } catch (error) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cv.tsx"></script>
  </body>
</html>
